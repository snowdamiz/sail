[env]
SAIL_HOME = "/data/sail"
T3CODE_HOME = "/data/sail"
SAIL_STARTUP_PAIRING = "off"
SAIL_OWNER_PASSWORD = "true"
SAIL_LOCAL_SESSIONS = "off"

[[mounts]]
source = "sail_data"
destination = "/data"
initial_size = "3GB"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
method = "GET"
path = "/"
interval = "15s"
timeout = "5s"
grace_period = "30s"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
