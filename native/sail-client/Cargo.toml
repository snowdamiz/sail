[package]
name = "sail-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "11e4141daab052916566e2f617f128b15b5b7d1c", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "11e4141daab052916566e2f617f128b15b5b7d1c", default-features = false }
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "11e4141daab052916566e2f617f128b15b5b7d1c", default-features = false, features = [
  "font-kit",
  "runtime_shaders",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "11e4141daab052916566e2f617f128b15b5b7d1c", default-features = false, features = [
  "wayland",
  "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "11e4141daab052916566e2f617f128b15b5b7d1c", default-features = false }
futures-channel = "0.3"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "Window"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
