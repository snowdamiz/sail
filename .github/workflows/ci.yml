name: Sail CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sail-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, format, icons, knip & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run icons:check
      - run: vp fmt --check
      - run: vp lint --report-unused-disable-directives
      - run: vp run knip:check
      - run: vp run typecheck

  rust:
    name: Rust sidecars (resource-monitor & sail-boatd)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/resource-monitor -> target
            native/sail-boat -> target
      - name: Test resource-monitor
        run: cargo test --manifest-path native/resource-monitor/Cargo.toml
      - name: Test sail-boatd
        run: cargo test --manifest-path native/sail-boat/Cargo.toml

  tests:
    name: Unit tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - root
          - desktop
          - server
          - shared
          - web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Install Linux desktop test dependencies
        if: matrix.suite == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Run root script tests
        if: matrix.suite == 'root'
        env:
          TMPDIR: /tmp
        run: vp test run scripts/build-desktop-artifact.test.ts scripts/build-desktop-installers.test.ts scripts/merge-update-manifests.test.ts
      - name: Run desktop unit tests
        if: matrix.suite == 'desktop'
        run: vp test run apps/desktop/src/updates/MacArchiveUpdater.test.ts apps/desktop/src/app/DesktopAppIdentity.test.ts apps/desktop/src/app/DesktopLinuxUrlHandler.test.ts apps/desktop/src/app/DesktopPreReadyPlatform.test.ts
      - name: Run server telemetry & Boats unit tests
        if: matrix.suite == 'server'
        run: vp test run apps/server/src/telemetry/AnalyticsService.test.ts apps/server/src/boat/ apps/server/src/auth/RpcAuthorization.test.ts packages/client-runtime/src/state/boats.test.ts
      - name: Run shared package tests
        if: matrix.suite == 'shared'
        run: vp run --filter @t3tools/shared test
      - name: Run web unit tests
        if: matrix.suite == 'web'
        working-directory: apps/web
        run: vp test run --project unit src/components/desktopUpdate.logic.test.ts src/components/boats/

  server-image-changes:
    name: Detect server image changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull_request checkout is the merge commit, so its first parent is the base tip.
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD |
              grep -qE '^(Dockerfile|\.dockerignore|deploy/docker/|scripts/stage-server-runtime|scripts/smoke-docker-image\.ts)'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  server-image:
    name: Server image build & smoke
    needs: server-image-changes
    if: needs.server-image-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Test the staged server runtime
        run: vp test run scripts/stage-server-runtime.test.ts scripts/build-cli-archive.test.ts
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sail-server:ci
          cache-from: type=gha,scope=sail-server
          cache-to: type=gha,scope=sail-server,mode=max
      - name: Smoke the server image
        run: node scripts/smoke-docker-image.ts --image sail-server:ci
